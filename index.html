<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elevator Simulator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Elevator Simulator</h1>

    <section id="config">
      <label>Stories <input id="n" type="number" min="2" max="20" value="3" /></label>
      <label>Elevators <input id="m" type="number" min="1" max="8" value="2" /></label>
      <label>Capacity <input id="cap" type="number" min="1" max="30" value="8" /></label>
      <label>Elev speed <input id="elevSpeed" type="number" min="0.1" max="20" step="0.1" value="2" /></label>
      <label>Stop time <input id="stopTime" type="number" min="0" max="10" step="0.1" value="0.8" /></label>
      <label>Board time <input id="boardTime" type="number" min="0" max="5" step="0.1" value="0.1" /></label>
      <label>Speed <input id="speed" type="number" min="1" max="120" step="1" value="2" /></label>
      <button id="randomize">Randomize</button>
      <button id="toggle">Pause</button>
      <button id="reset">Reset</button>
    </section>

    <div id="stats">
      Time: <span id="statTime">0.00</span> h &middot; Served: <span id="statServed">0</span> &middot; Waiting: <span id="statWaiting">0</span> &middot; Longest wait: <span id="statMaxWait">0.00</span> h &middot; Trips: <span id="statTrips">0</span>
    </div>

    <section id="matrix-wrap">
      <h2>People per hour (from &rarr; to)</h2>
      <table id="matrix"></table>
    </section>

    <section id="building-wrap">
      <div id="floor-panel"></div>
      <div id="shafts"></div>
    </section>

    <section id="charts">
      <canvas id="hist" width="560" height="180"></canvas>
      <canvas id="line" width="560" height="180"></canvas>
    </section>

    <script src="script.js"></script>
  </body>
</html>
