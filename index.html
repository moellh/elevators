<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elevator Simulator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Elevator Simulator</h1>
    <p class="note">Shuttle algorithm: elevators cycle top &harr; bottom, skipping floors with no demand, and skipping waiting passengers when the cabin is full.</p>

    <section id="config">
      <label>Stories <input id="n" type="number" min="2" max="12" value="6" /></label>
      <label>Elevators <input id="m" type="number" min="1" max="6" value="2" /></label>
      <label>Capacity <input id="cap" type="number" min="1" max="20" value="8" /></label>
      <label>Speed <input id="speed" type="range" min="1" max="720" step="1" value="60" /><span id="speedLabel">60x</span></label>
      <button id="apply">Apply</button>
      <button id="randomize">Randomize</button>
      <button id="toggle">Pause</button>
      <button id="reset">Reset</button>
    </section>

    <div id="stats">
      Time: <span id="statTime">0.00</span> h &middot; Served: <span id="statServed">0</span> &middot; Waiting: <span id="statWaiting">0</span>
    </div>

    <section id="matrix-wrap">
      <h2>People per hour (from &rarr; to)</h2>
      <table id="matrix"></table>
    </section>

    <section id="building-wrap">
      <div id="floor-panel"></div>
      <div id="shafts"></div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
